name: Publish Spectral Paint 1.0.9
on:
  push:
    branches: [main]
    paths: ['.release-assets/v1.0.9/publish-manifest.json']
permissions:
  contents: write
concurrency:
  group: spectral-paint-release-1.0.9
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble and verify approved release files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          base=Path('.release-assets/v1.0.9')
          m=json.loads((base/'publish-manifest.json').read_text())
          out=Path('release-output');out.mkdir()
          data=b''
          for entry in m['parts']:
              part=Path(entry['path']).read_bytes()
              assert len(part)==entry['size']
              assert hashlib.sha256(part).hexdigest()==entry['sha256']
              data+=part
          assert len(data)==m['size_bytes']
          assert hashlib.sha256(data).hexdigest()==m['sha256']
          archive=out/m['zip_name'];archive.write_bytes(data)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for name in ['SpectralPaint-1.0.9-Users-Manual.pdf','WHATS-NEW-1.0.9.txt']:
                  (out/name).write_bytes(z.read(name))
          (out/'SHA256SUMS.txt').write_bytes((base/'SHA256SUMS.txt').read_bytes())
          for entry in m['assets']:
              content=(out/entry['name']).read_bytes()
              assert len(content)==entry['size']
              assert hashlib.sha256(content).hexdigest()==entry['sha256']
          PY
          cd release-output
          sha256sum --check SHA256SUMS.txt
      - name: Publish complete Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=$(python3 -c "import json; print(json.load(open('.release-assets/v1.0.9/publish-manifest.json'))['release_target'])")
          gh release create v1.0.9 --target "$target" --title "Spectral Paint 1.0.9 — Windows Application + ARA VST3" --notes-file .release-assets/v1.0.9/RELEASE-NOTES.md --draft
          gh release upload v1.0.9 release-output/SpectralPaint-1.0.9-Windows-App-and-VST3-x64.zip release-output/SpectralPaint-1.0.9-Users-Manual.pdf release-output/WHATS-NEW-1.0.9.txt release-output/SHA256SUMS.txt
          gh release edit v1.0.9 --draft=false --latest
